[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bb_gym"
version = "0.1.0"
description = "An environment for learning bivariate bicycle codes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Omer Sella", email = "omer.s.sella@gmail.com"}]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "ldpc>=2.0",
    "numba>=0.67.0",
    "gymnasium>=1.3.0",
    "pytest>=9.1.1",
    "marimo>=0.24.2",
    "torch==2.10.0",
    "torchrl==0.13.1",
    "tensordict==0.13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
plots = ["matplotlib>=3.9"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.urls]
Repository = "https://github.com/OmerSella/bb-gym"
Paper = "https://arxiv.org/abs/2608.15754"

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/bb_gym"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
